{{/* {{< youtube id="VIDEO_ID" >}} */}}
<figure class="media media-embed">
  <iframe src="https://www.youtube-nocookie.com/embed/{{ .Get "id" | default (.Get 0) }}" title="{{ .Get "title" | default "YouTube video" }}"
          allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>
</figure>
